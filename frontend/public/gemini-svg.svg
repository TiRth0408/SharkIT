<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Primary Blue to Lavender Accent -->
    <linearGradient id="finPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BA9EB" />
      <stop offset="100%" stop-color="#9D8CFF" />
    </linearGradient>
  </defs>

  <!-- Modern Rounded Shield / Badge Background -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0A0F1D" stroke="url(#finPulseGrad)" stroke-width="3.5" />

  <!-- Pulse / Growth Trajectory Waveform -->
  <path d="M 20 54 L 34 54 L 44 26 L 56 74 L 66 46 L 74 54 L 80 54" 
        fill="none" 
        stroke="url(#finPulseGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Dynamic Apex Indicator Dot -->
  <circle cx="44" cy="26" r="4.5" fill="#3BA9EB" />
</svg>
